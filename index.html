<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>
      Levelup Xperience - Community for Freelancers, Creators & Learners
    </title>
    <meta
      name="title"
      content="Levelup Xperience - Community for Freelancers, Creators & Learners"
    />
    <meta

      content="A vibrant community platform connecting freelancers, content creators, and learners. Join our waitlist to grow, collaborate, and elevate your skills in a supportive environment."
    />
    <meta
      name="keywords"
      content="freelancer community, content creator platform, learning community, skill development, collaboration platform, freelance network, creative community"
    />
    <meta name="author" content="Levelup Xperience" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="Levelup Xperience - Community for Freelancers, Creators & Learners"
    />
    <meta
      property="og:description"
      content="A vibrant community platform connecting freelancers, content creators, and learners. Join our waitlist to grow, collaborate, and elevate your skills."
    />
    <meta property="og:site_name" content="Levelup Xperience" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:title"
      content="Levelup Xperience - Community for Freelancers, Creators & Learners"
    />
    <meta
      property="twitter:description"
      content="A vibrant community platform connecting freelancers, content creators, and learners. Join our waitlist to grow, collaborate, and elevate your skills."
    />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.io" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/site.webmanifest" />

    <!-- Theme -->
    <meta name="theme-color" content="#2ECC71" />
    <meta name="msapplication-TileColor" content="#2ECC71" />

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Apply saved theme before paint to avoid flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("levelup-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Levelup Xperience",
        "description": "A vibrant community platform connecting freelancers, content creators, and learners. Join our waitlist to grow, collaborate, and elevate your skills in a supportive environment.",
        "applicationCategory": "SocialNetworkingApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "provider": {
          "@type": "Organization",
          "name": "Levelup Xperience",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@levelupxperience.com",
            "telephone": "+234-800-123-4567",
            "contactType": "Customer Support"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
