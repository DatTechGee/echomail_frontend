<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
<title>
      EchoMail - Email Marketing Platform
    </title>
    <meta
      name="title"
      content="EchoMail - Email Marketing Platform"
    />
    <meta
      name="description"
      content="Create and send beautiful email campaigns that engage your audience and grow your business."
    />
    <meta name="keywords" content="email marketing, newsletter, campaign manager, send emails, grow business" />
    <meta name="author" content="EchoMail" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="EchoMail - Email Marketing Platform"
    />
    <meta
      property="og:description"
      content="Create and send beautiful email campaigns that engage your audience and grow your business. Automate newsletters, track opens, and reach every inbox."
    />
    <meta property="og:site_name" content="EchoMail" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta
      property="twitter:title"
      content="EchoMail - Email Marketing Platform"
    />
    <meta
      property="twitter:description"
      content="Create and send beautiful email campaigns that engage your audience and grow your business. Automate newsletters, track opens, and reach every inbox."
    />

    <!-- Favicons -->
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.io" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/apple-touch-icon.png"
    />
    <link rel="manifest" href="/assets/site.webmanifest" />

    <!-- Theme -->
    <meta name="theme-color" content="#2563EB" />
    <meta name="msapplication-TileColor" content="#2563EB" />

    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Apply saved theme before paint to avoid flash -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("echomail-theme") || "system";
          var dark =
            t === "dark" ||
            (t === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {}
      })();
    </script>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "EchoMail",
        "description": "Email marketing platform to create, automate, and track beautiful email campaigns. Reach every inbox with confidence.",
        "applicationCategory": "BusinessApplication",
        "operatingSystem": "Web",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        },
        "provider": {
          "@type": "Organization",
          "name": "EchoMail",
          "contactPoint": {
            "@type": "ContactPoint",
            "email": "hello@echomail.com",
            "telephone": "+234-900-000-0000",
            "contactType": "Customer Support"
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
